<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scroll — проверка камеры и микрофона</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark }
  body { margin:0; padding:18px; background:#07070c; color:#f6f6fb;
         font:15px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif; }
  h1 { font-size:19px; margin:0 0 14px }
  button { width:100%; margin:7px 0; padding:14px; border:0; border-radius:14px;
           background:linear-gradient(120deg,#8b5cff,#ff3d81); color:#fff; font-size:15px; font-weight:800 }
  button.g { background:#191924 }
  pre { white-space:pre-wrap; word-break:break-word; background:#111119; padding:12px;
        border-radius:12px; font-size:12.5px; line-height:1.45; margin:12px 0 }
  .ok { color:#3ddc84 } .bad { color:#ff5a7a } .row { display:flex; gap:10px; align-items:center; margin:10px 0 }
  video { width:140px; height:140px; border-radius:50%; object-fit:cover; background:#000 }
  audio { width:100% }
</style>
</head>
<body>
<h1>Проверка камеры и микрофона</h1>
<div id="info"></div>
<button onclick="testMic()">1. Проверить микрофон (запишет 3 сек)</button>
<button onclick="testCam()">2. Проверить камеру (кружочек, 3 сек)</button>
<button class="g" onclick="navigator.clipboard&&navigator.clipboard.writeText(out.textContent)">Скопировать результат</button>
<div class="row"><video id="prev" playsinline muted></video><div id="play"></div></div>
<pre id="out">Нажми кнопку 1, потом кнопку 2.</pre>
<script>
const out = document.getElementById('out');
const log = (s, cls) => { out.innerHTML += `\n<span class="${cls||''}">${s}</span>`; };
const tg = window.Telegram && window.Telegram.WebApp;
try { tg && tg.ready(); tg && tg.expand(); } catch (e) {}

const MIMES = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/aac','audio/ogg;codecs=opus',
               'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
out.textContent =
  'Платформа Telegram: ' + ((tg && tg.platform) || 'не в Telegram') +
  '\nВерсия Telegram: ' + ((tg && tg.version) || '—') +
  '\nБраузер: ' + navigator.userAgent.slice(0, 120) +
  '\nЗащищённое соединение: ' + window.isSecureContext +
  '\ngetUserMedia есть: ' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) +
  '\nMediaRecorder есть: ' + (typeof MediaRecorder !== 'undefined') +
  '\nФорматы записи: ' + (typeof MediaRecorder === 'undefined' ? '—'
      : MIMES.filter(m => MediaRecorder.isTypeSupported(m)).join(', ') || 'ни одного');

async function record(constraints, label, onStream) {
  log('\n--- ' + label + ' ---');
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return log('getUserMedia недоступен', 'bad');
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia(constraints); }
  catch (e) { return log('ДОСТУП НЕ ДАЛИ: ' + e.name + ' — ' + e.message, 'bad'); }
  log('доступ получен', 'ok');
  if (onStream) onStream(stream);
  const type = MIMES.filter(m => m.startsWith(constraints.video ? 'video' : 'audio'))
                    .find(m => MediaRecorder.isTypeSupported(m));
  let rec;
  try { rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined); }
  catch (e) { stream.getTracks().forEach(t => t.stop()); return log('MediaRecorder не создался: ' + e.message, 'bad'); }
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: rec.mimeType });
    log('записано: ' + Math.round(blob.size / 1024) + ' КБ, формат ' + (rec.mimeType || '?'), 'ok');
    const el = document.createElement(constraints.video ? 'video' : 'audio');
    el.controls = true; el.playsInline = true; el.src = URL.createObjectURL(blob);
    if (constraints.video) { el.style.cssText = 'width:140px;height:140px;border-radius:50%;object-fit:cover'; }
    const box = document.getElementById('play'); box.innerHTML = ''; box.appendChild(el);
    log('получилось — проверь, воспроизводится ли', 'ok');
  };
  rec.start(); log('пишу 3 секунды…');
  setTimeout(() => { try { rec.stop(); } catch (e) { log('стоп не сработал: ' + e.message, 'bad'); } }, 3000);
}
const testMic = () => record({ audio: true }, 'МИКРОФОН');
const testCam = () => record(
  { video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 480 } }, audio: true },
  'КАМЕРА',
  s => { const p = document.getElementById('prev'); p.srcObject = s; p.play().catch(() => {}); });
</script>
</body>
</html>
